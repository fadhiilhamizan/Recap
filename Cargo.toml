[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/recap-sidecar", "crates/recap-dummy-sidecar"]
# Prototipe spike punya workspace sendiri.
exclude = ["tools/spikes/s1-capture"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.0.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
