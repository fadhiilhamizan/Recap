[package]
name = "s1-capture"
version = "0.1.0"
edition = "2021"
description = "Spike S1: capture mic + system audio Windows (process loopback), dua track WAV crash-safe"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
wasapi = "0.25"
hound = "3.5"
crossbeam-channel = "0.5"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
ctrlc = "3.5"
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }

[profile.release]
debug = 1
